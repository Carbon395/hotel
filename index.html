<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺北市旅館業照片與登記證製作系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        :root {
            --primary-color: #1a365d;
            --accent-color: #3182ce;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
        }

        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            color: #2d3748;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            max-width: 1100px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        header p {
            color: #718096;
            margin: 0;
            font-size: 15px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-box {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: #f8fafc;
            transition: all 0.2s;
        }

        .upload-box:hover {
            border-color: var(--accent-color);
            background: #edf2f7;
        }

        .upload-box p {
            margin: 8px 0 0 0;
            font-size: 14px;
            color: #4a5568;
        }

        input[type="file"] {
            display: none;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }

        /* 裁切視窗樣式 */
        .crop-container {
            width: 100%;
            max-height: 350px;
            background-color: #000;
            margin-top: 10px;
            border-radius: 6px;
            overflow: hidden;
            display: none;
        }

        .crop-container img {
            max-width: 100%;
            display: block;
        }

        /* 預覽與下載面板 */
        .preview-panel {
            position: sticky;
            top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .preview-wrapper {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            background: #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #cbd5e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #resultPreview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .placeholder-text {
            color: #a0aec0;
            font-size: 15px;
            text-align: center;
            padding: 20px;
        }

        .btn-download {
            width: 100%;
            max-width: 500px;
            background: #2f855a;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
            display: none;
        }

        .btn-download:hover {
            background: #22543d;
        }

        /* 隱藏真實處理的畫布 */
        #hiddenCanvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>臺北市旅館業照片與登記證製作系統</h1>
        <p>臺北市政府觀光傳播局</p>
    </header>

    <div class="main-layout">
        <div class="control-panel">
            
            <div class="card">
                <div class="card-title">① 上傳旅館實景照片並調整範圍</div>
                <div class="upload-box" onclick="document.getElementById('photoFile').click()">
                    <svg style="width:32px;height:32px;margin:auto;fill:#718096" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    <p>點擊上傳主要照片</p>
                </div>
                <input type="file" id="photoFile" accept="image/*">
                
                <div class="crop-container" id="cropContainer">
                    <img id="cropImage" alt="裁切暫存圖">
                </div>
            </div>

            <div class="card">
                <div class="card-title">② 上傳圓形黃底「H」旅館標識</div>
                <div class="upload-box" onclick="document.getElementById('logoFile').click()">
                    <svg style="width:32px;height:32px;margin:auto;fill:#718096" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.25z"/></svg>
                    <p>點擊上傳旅館標識 Logo</p>
                </div>
                <input type="file" id="logoFile" accept="image/*">
            </div>

            <div class="card">
                <div class="card-title">③ 輸入臺北市旅館業登記證號</div>
                <input type="text" id="certNumber" class="input-field" placeholder="請輸入證號數字，例如：888" value="">
            </div>

        </div>

        <div class="preview-panel">
            <div style="font-weight: bold; font-size: 15px; color: #4a5568;">【 1:1 方形合成照片效果預覽 】</div>
            <div class="preview-wrapper">
                <div class="placeholder-text" id="placeholderText">請先完成左側「步驟 ①」上傳照片，系統將自動開啟裁切與即時預覽。</div>
                <img id="resultPreview" alt="合成最終結果">
            </div>
            <a id="downloadBtn" class="btn-download">儲存並下載高解析度照片</a>
        </div>
    </div>
</div>

<canvas id="hiddenCanvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
    // 宣告全局變數
    let cropper = null;
    let uploadedLogoImg = null;
    
    const photoFileInput = document.getElementById('photoFile');
    const logoFileInput = document.getElementById('logoFile');
    const certNumberInput = document.getElementById('certNumber');
    const cropImage = document.getElementById('cropImage');
    const cropContainer = document.getElementById('cropContainer');
    const resultPreview = document.getElementById('resultPreview');
    const placeholderText = document.getElementById('placeholderText');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');

    // 1. 監聽主照片上傳並初始化自定義裁切工具
    photoFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            // 如果已有舊的裁切器則銷毀
            if (cropper) {
                cropper.destroy();
            }
            
            cropImage.src = event.target.result;
            cropContainer.style.display = 'block';
            
            // 初始化 Cropper：鎖定 1:1 方形、開啟精緻移動網格
            cropper = new Cropper(cropImage, {
                aspectRatio: 1,
                viewMode: 1,
                background: false,
                autoCropArea: 1,
                cropend: generateSynthesis, // 拖曳結束時自動重繪
                zoom: generateSynthesis,    // 縮放時自動重繪
                ready: function () {
                    generateSynthesis();   // 載入完成立即初次繪製
                }
            });
        };
        reader.readAsDataURL(file);
    });

    // 2. 監聽標識 Logo 上傳
    logoFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                uploadedLogoImg = img;
                generateSynthesis(); // 重新合成
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // 3. 監聽文字輸入即時重繪
    certNumberInput.addEventListener('input', generateSynthesis);

    // 4. 高階核心合成運算
    function generateSynthesis() {
        if (!cropper) return;

        // 建立超高解析度畫布輸出（1200 x 1200 px 方形，確保印刷不模糊）
        const canvasSize = 1200;
        canvas.width = canvasSize;
        canvas.height = canvasSize;

        // 取得使用者選取的裁切影像數據並繪製到大畫布上
        const croppedCanvas = cropper.getCroppedCanvas({
            width: canvasSize,
            height: canvasSize
        });
        
        ctx.drawImage(croppedCanvas, 0, 0, canvasSize, canvasSize);

        // --- 行政標準規格：3公分底框在大圖中的精準比例計算 ---
        // 當總高為 1200px 時，依照比例 3公分底框的最佳渲染高度為 110 px
        const barHeight = 110; 
        const barY = canvasSize - barHeight;

        // 繪製與照片完美對齊的純白底框
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, barY, canvasSize, barHeight);

        // 取得證號並組合規範文字
        const certNo = certNumberInput.value.trim();
        const mainText = `臺北市 旅館登記證 第 ${certNo} 號`;

        // 設定字體：微軟正黑體、粗體(bold)、66級字（66px）
        ctx.font = "bold 80px 'Microsoft JhengHei', '微軟正黑體', sans-serif";
        ctx.textBaseline = 'middle';

        // 量測指定 80 級字體在畫布上的實際總寬度
        const textWidth = ctx.measureText(mainText).width;

        // --- 標識（Logo）填滿規格計算 ---
        // 為了完美填滿底框且兼顧美觀，Logo 高度設定為底框高（110px）的 90%，上下保留極微精緻空隙
        const logoHeight = barHeight * 0.90; 
        let logoWidth = logoHeight; // 預設 1:1 比例

        if (uploadedLogoImg) {
            // 如果上傳了非正方形 Logo，依原圖比例縮放寬度
            const imgRatio = uploadedLogoImg.width / uploadedLogoImg.height;
            logoWidth = logoHeight * imgRatio;
        }

        const spacing = 25; // 標識與文字之間的專業排版間距（25px）

        // 計算整串「標識 + 間距 + 文字」的總寬度，用於整體水平置中排版
        let totalContentWidth = textWidth;
        if (uploadedLogoImg) {
            totalContentWidth += (logoWidth + spacing);
        }

        // 決定起點 X 座標與 Y 軸核心置中線
        let currentX = (canvasSize - totalContentWidth) / 2;
        const centerY = barY + (barHeight / 2);

        // 繪製旅館標識（置於文字正前方）
        if (uploadedLogoImg) {
            const logoY = centerY - (logoHeight / 2);
            ctx.drawImage(uploadedLogoImg, currentX, logoY, logoWidth, logoHeight);
            currentX += logoWidth + spacing; // 移動 X 軸留供文字繪製
        }

        // 繪製登記證核心文字
        ctx.fillStyle = '#000000'; // 黑色粗體字
        ctx.fillText(mainText, currentX, centerY);

        // 5. 將結果輸出至網頁預覽
        const finalDataURL = canvas.toDataURL('image/jpeg', 0.95);
        resultPreview.src = finalDataURL;
        
        // 顯示結果
        placeholderText.style.display = 'none';
        resultPreview.style.display = 'block';
        
        // 設定下載連結與檔名
        downloadBtn.href = finalDataURL;
        downloadBtn.download = `臺北市旅館業登記證照片_${certNo || '未填證號'}.jpg`;
        downloadBtn.style.display = 'block';
    }
</script>

</body>
</html>
