<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺北市旅館數位服務系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        :root {
            --primary-color: #1a365d;
            --accent-color: #3182ce;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, "PingFang TC", "Microsoft JhengHei", "Heiti TC", Arial, sans-serif;
            background-color: var(--bg-color);
            color: #2d3748;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            max-width: 1100px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        header p {
            color: #718096;
            margin: 0;
            font-size: 15px;
            font-weight: bold;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-box {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: #f8fafc;
            transition: all 0.2s;
        }

        .upload-box:hover {
            border-color: var(--accent-color);
            background: #edf2f7;
        }

        .upload-box p {
            margin: 8px 0 0 0;
            font-size: 14px;
            font-weight: bold;
            color: #4a5568;
        }

        input[type="file"] {
            display: none;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            box-sizing: border-box;
            transition: border 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }

        .crop-container {
            width: 100%;
            max-height: 350px;
            background-color: #000;
            margin-top: 10px;
            border-radius: 6px;
            overflow: hidden;
            display: none;
        }

        .crop-container img {
            max-width: 100%;
            display: block;
        }

        .preview-panel {
            position: sticky;
            top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .preview-wrapper {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            background: #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #cbd5e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #resultPreview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .placeholder-text {
            color: #a0aec0;
            font-size: 15px;
            text-align: center;
            padding: 20px;
            font-weight: bold;
        }

        .btn-download {
            width: 100%;
            max-width: 500px;
            background: #2f855a;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
            display: none;
        }

        .btn-download:hover {
            background: #22543d;
        }

        #hiddenCanvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>臺北市旅館數位服務系統</h1>
        <p>臺北市政府觀光傳播局 版權所有</p>
    </header>

    <div class="main-layout">
        <div class="control-panel">
            
            <div class="card">
                <div class="card-title">① 上傳旅館實景照片並調整範圍</div>
                <div class="upload-box" onclick="document.getElementById('photoFile').click()">
                    <svg style="width:32px;height:32px;margin:auto;fill:#718096" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    <p>點擊上傳照片</p>
                </div>
                <input type="file" id="photoFile" accept="image/*">
                
                <div class="crop-container" id="cropContainer">
                    <img id="cropImage" alt="裁切暫存圖">
                </div>
            </div>

            <div class="card">
                <div class="card-title">② 上傳圓形黃底「H」旅館標識</div>
                <div class="upload-box" onclick="document.getElementById('ptotoFile').click()">
                    <svg style="width:32px;height:32px;margin:auto;fill:#718096" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.25z"/></svg>
                    <p>點擊上傳旅館標識</p>
                </div>
                <input type="file" id="logoFile" accept="image/*">
            </div>

            <div class="card">
                <div class="card-title">③ 輸入臺北市旅館業登記證號</div>
                <input type="text" id="certNumber" class="input-field" placeholder="請輸入證號數字，例如：000" value="000">
            </div>

        </div>

        <div class="preview-panel">
            <div style="font-weight: bold; font-size: 15px; color: #4a5568;">【 照片預覽 】</div>
            <div class="preview-wrapper">
                <div class="placeholder-text" id="placeholderText">請先完成左側「步驟 ①」上傳照片，系統將自動開啟裁切與即時預覽。</div>
                <img id="resultPreview" alt="合成最終結果">
            </div>
            <a id="downloadBtn" class="btn-download">儲存並下載高解析度照片</a>
        </div>
    </div>
</div>

<canvas id="hiddenCanvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
    let cropper = null;
    let uploadedLogoImg = null;
    
    const photoFileInput = document.getElementById('photoFile');
    const logoFileInput = document.getElementById('logoFile');
    const certNumberInput = document.getElementById('certNumber');
    const cropImage = document.getElementById('cropImage');
    const cropContainer = document.getElementById('cropContainer');
    const resultPreview = document.getElementById('resultPreview');
    const placeholderText = document.getElementById('placeholderText');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');

    // Canvas 專用粗黑體字型設定
    const zhFontSetting = 'bold 56px "Microsoft JhengHei", "PingFang TC", "Source Han Sans TC", sans-serif';
    const enFontSetting = 'bold 32px "Helvetica Neue", Helvetica, Arial, sans-serif';

    // 🚀 核心優化：前置相片壓縮處理，防止巨量像素摧毀 Canvas 記憶體
    photoFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const tempImg = new Image();
            tempImg.onload = function() {
                // 設定安全上限尺寸 (2000px)，既能維持超高解析印刷品質，又絕對不會讓瀏覽器崩潰
                const maxSide = 2000;
                let targetWidth = tempImg.width;
                let targetHeight = tempImg.height;

                if (targetWidth > maxSide || targetHeight > maxSide) {
                    if (targetWidth > targetHeight) {
                        targetHeight = Math.round((targetHeight * maxSide) / targetWidth);
                        targetWidth = maxSide;
                    } else {
                        targetWidth = Math.round((targetWidth * maxSide) / targetHeight);
                        targetHeight = maxSide;
                    }
                }

                // 建立背景微型 Canvas 進行快速平滑壓縮
                const resizeCanvas = document.createElement('canvas');
                resizeCanvas.width = targetWidth;
                resizeCanvas.height = targetHeight;
                const resizeCtx = resizeCanvas.getContext('2d');
                
                // 啟動高品質縮放鋸齒優化
                resizeCtx.imageSmoothingEnabled = true;
                resizeCtx.imageSmoothingQuality = 'high';
                resizeCtx.drawImage(tempImg, 0, 0, targetWidth, targetHeight);

                // 導出安全體積的 Base64 數據給裁切器
                const safeDataURL = resizeCanvas.toDataURL('image/jpeg', 0.95);

                if (cropper) cropper.destroy();
                
                cropImage.src = safeDataURL;
                cropContainer.style.display = 'block';
                
                cropper = new Cropper(cropImage, {
                    aspectRatio: 1,
                    viewMode: 1,
                    background: false,
                    autoCropArea: 1,
                    crop: function() { generateSynthesis(); }
                });
            };
            tempImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    logoFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                uploadedLogoImg = img;
                generateSynthesis();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    certNumberInput.addEventListener('input', generateSynthesis);

    function drawDefaultLogo(context, x, y, size) {
        context.save();
        context.beginPath();
        context.arc(x + size/2, y + size/2, size/2, 0, Math.PI * 2);
        context.fillStyle = '#FFD700';
        context.fill();

        context.fillStyle = '#000000';
        const fontSize = Math.floor(size * 0.65);
        context.font = `bold ${fontSize}px "Microsoft JhengHei", sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText('H', x + size/2, y + size/2 + (fontSize * 0.03));
        context.restore();
    }

    // 完美兩端對齊
    function drawJustifiedText(context, text, x, y, maxWidth) {
        const textLength = text.length;
        if (textLength <= 1) {
            context.fillText(text, x, y);
            return;
        }

        let totalNormalWidth = 0;
        for (let i = 0; i < textLength; i++) {
            totalNormalWidth += context.measureText(text[i]).width;
        }

        const totalSpacing = maxWidth - totalNormalWidth;
        const letterSpacing = totalSpacing / (textLength - 1);

        let currentX = x;
        for (let i = 0; i < textLength; i++) {
            context.fillText(text[i], currentX, y);
            currentX += context.measureText(text[i]).width + letterSpacing;
        }
    }

    // 核心排版引擎
    function generateSynthesis() {
        if (!cropper) return;

        const canvasSize = 1200;
        canvas.width = canvasSize;
        canvas.height = canvasSize;

        const croppedCanvas = cropper.getCroppedCanvas({
            width: canvasSize,
            height: canvasSize,
            imageSmoothingEnabled: true,
            imageSmoothingQuality: 'high'
        });
        
        if (!croppedCanvas) return;
        ctx.drawImage(croppedCanvas, 0, 0, canvasSize, canvasSize);

        // 幾何規格設定 (4公分高度與1.5公分留白比例演算)
        const barHeight = 148; 
        const bottomMargin = 55;
        const barY = canvasSize - barHeight - bottomMargin;

        // 繪製純白底框
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, barY, canvasSize, barHeight);

        const certNo = certNumberInput.value.trim() || '000';
        const zhText = `臺北市 旅館登記證 第 ${certNo} 號`;
        const enText = `Taipei City Hotel Registration Certificate No. ${certNo}`;

        const logoSize = barHeight * 0.84; 
        let logoWidth = logoSize;
        if (uploadedLogoImg) {
            logoWidth = logoSize * (uploadedLogoImg.width / uploadedLogoImg.height);
        }

        const paddingX = 45;
        const logoX = paddingX;
        const logoY = barY + (barHeight - logoSize) / 2;

        // 1. 繪製標識
        if (uploadedLogoImg) {
            ctx.drawImage(uploadedLogoImg, logoX, logoY, logoWidth, logoSize);
        } else {
            drawDefaultLogo(ctx, logoX, logoY, logoSize);
        }
        
        // 計算文字可用寬度
        const textStartX = logoX + logoWidth + 35;
        const textEndX = canvasSize - paddingX;
        const textAvailableWidth = textEndX - textStartX;

        // 2. 繪製雙語排版文字
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        // 第一行：中文超粗黑體
        ctx.font = zhFontSetting;
        drawJustifiedText(ctx, zhText, textStartX, barY + (barHeight * 0.35), textAvailableWidth);

        // 第二行：英文清晰有力粗體
        ctx.font = enFontSetting;
        drawJustifiedText(ctx, enText, textStartX, barY + (barHeight * 0.72), textAvailableWidth);

        // 3. 輸出最終高解析度結果
        const finalDataURL = canvas.toDataURL('image/jpeg', 0.98);
        resultPreview.src = finalDataURL;
        
        placeholderText.style.display = 'none';
        resultPreview.style.display = 'block';
        
        downloadBtn.href = finalDataURL;
        downloadBtn.download = `臺北市旅館業登記證照片_${certNo}.jpg`;
        downloadBtn.style.display = 'block';
    }
</script>

</body>
</html>
